# Voraussetzung: button-card (HACS / Marketplace)
#
# TEIL 1: Templates – im Dashboard über "Raw-Konfigurationseditor"
#         ganz oben unter "button_card_templates:" einfügen
# TEIL 2: Die Karte selbst – als manuelle Karte einfügen
#         (Entitäten auf die eigenen anpassen, max = kWp der Anlage in W)
#
